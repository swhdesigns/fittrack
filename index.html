<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10251d"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>FitTrack</title><style>body{font:16px system-ui;background:#0d1814;color:#eaf7ee;margin:0}main{max-width:650px;margin:auto;padding:18px}h1{color:#a7f36b}nav{display:flex;gap:8px;flex-wrap:wrap}button{background:#b2f27c;color:#142216;border:0;border-radius:10px;padding:12px;font-weight:bold;cursor:pointer}nav button{background:#263c30;color:white}section{background:#192b22;border-radius:15px;padding:18px;margin:16px 0}input,select{background:#edf4ef;color:#10251d;border:0;border-radius:8px;padding:12px;max-width:95%;box-sizing:border-box}label{display:block;margin:10px 0}small{color:#bdd0c2}li{margin:12px 0}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #405747;padding:8px;text-align:left} .danger{background:#eab3a8}canvas{width:100%;height:180px}.primary{width:100%;font-size:17px;padding:16px}.muted{color:#bdd0c2}.counter{display:flex;align-items:center;gap:5px}.counter button{padding:10px}.counter input{width:70px;text-align:center}.progress{height:12px;background:#304638;border-radius:12px;overflow:hidden}.progress span{display:block;height:100%;background:#b2f27c}.sticky{position:sticky;bottom:0;background:#10251d;padding:12px;border-radius:12px;z-index:2}</style></head><body><main><h1>💪 FitTrack</h1><p>Your private fitness log · saved on this device</p><nav><button onclick="show('dashboard')">Home</button><button onclick="show('gym')">Workouts</button><button onclick="show('progress')">Progress</button><button onclick="show('settings')">Settings</button></nav><div id="view"></div></main><script>
const key='fittrack-v1';let data;try{data=JSON.parse(localStorage.getItem(key))||{body:[],gym:[],activity:[]}}catch{data={body:[],gym:[],activity:[]}};const save=()=>localStorage.setItem(key,JSON.stringify(data));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('en-CA');const box=(s)=>'<section>'+s+'</section>';const last=a=>a.length?a[a.length-1]:null;const dateInput=()=>'<label>Date <input id="date" type="date" value="'+today()+'"></label>';const field=(id,label,type='number',extra='')=>'<label>'+label+' <input id="'+id+'" type="'+type+'" '+extra+' required></label>';const val=id=>document.getElementById(id).value;const number=id=>Number(val(id));function add(kind,record){data[kind].push(record);data[kind].sort((a,b)=>a.date.localeCompare(b.date));save();show(kind==='body'?'progress':kind==='gym'?'gym':'activity')}function remove(kind,i){if(confirm('Delete this entry?')){data[kind].splice(i,1);save();show(kind)}}function rows(kind,format){return [...data[kind]].reverse().map((r,j)=>'<li>'+format(r)+' <button class="danger" onclick="remove(\''+kind+'\','+(data[kind].length-1-j)+')">Delete</button></li>').join('')||'<p>No entries yet.</p>'}
const routines={'Monday':[['Leg press',3,'8–12'],['Chest press machine',3,'8–12'],['Lat pulldown',3,'8–12'],['Romanian deadlift (dumbbells)',2,'8–12'],['Incline dumbbell press',2,'8–12'],['Seated cable row',2,'10–12'],['Tricep rope pushdown',2,'10–15'],['Cable crunches',2,'12–15']],'Thursday':[['Goblet squat',3,'8–12'],['Leg curl machine',3,'10–15'],['Seated cable row',3,'8–12'],['Shoulder press machine',3,'8–12'],['Lat pulldown',2,'8–12'],['Chest press machine',2,'10–12'],['Dumbbell bicep curls',2,'10–12'],['Standing calf raises',2,'12–15']]};const libraryKey='fittrack-library-v1';const starterPrograms=[{id:'fullbody',name:'Full Body A/B',workouts:[{id:'Monday',name:'Workout A — Full Body (Chest Focus)',exercises:routines.Monday},{id:'Thursday',name:'Workout B — Full Body (Back & Shoulders Focus)',exercises:routines.Thursday}]},{id:'pushpull',name:'Push / Pull',workouts:[{id:'push',name:'Push — Chest, Shoulders & Triceps',exercises:[['Chest press machine',3,'8–12'],['Incline dumbbell press',3,'8–12'],['Shoulder press machine',3,'8–12'],['Dumbbell lateral raises',3,'12–15'],['Tricep rope pushdown',3,'10–15']]},{id:'pull',name:'Pull — Back & Biceps',exercises:[['Lat pulldown',3,'8–12'],['Seated cable row',3,'8–12'],['Chest-supported row',3,'10–12'],['Dumbbell bicep curls',3,'10–12'],['Hammer curls',3,'10–12']]}]},{id:'upperlower',name:'Upper / Lower',workouts:[{id:'upper',name:'Upper Body',exercises:[['Chest press machine',3,'8–12'],['Lat pulldown',3,'8–12'],['Shoulder press machine',3,'8–12'],['Seated cable row',3,'8–12'],['Tricep rope pushdown',2,'10–15'],['Dumbbell bicep curls',2,'10–12']]},{id:'lower',name:'Lower Body',exercises:[['Leg press',3,'8–12'],['Romanian deadlift (dumbbells)',3,'8–12'],['Leg curl machine',3,'10–15'],['Goblet squat',2,'8–12'],['Standing calf raises',3,'12–15'],['Cable crunches',2,'12–15']]}]},{id:'ppl',name:'Push / Pull / Legs',workouts:[{id:'pplpush',name:'Push',exercises:[['Chest press machine',3,'8–12'],['Incline dumbbell press',3,'8–12'],['Shoulder press machine',3,'8–12'],['Tricep rope pushdown',3,'10–15']]},{id:'pplpull',name:'Pull',exercises:[['Lat pulldown',3,'8–12'],['Seated cable row',3,'8–12'],['Dumbbell bicep curls',3,'10–12'],['Hammer curls',2,'10–12']]},{id:'ppllegs',name:'Legs',exercises:[['Leg press',3,'8–12'],['Romanian deadlift (dumbbells)',3,'8–12'],['Leg curl machine',3,'10–15'],['Standing calf raises',3,'12–15']]}]}];let library;try{library=JSON.parse(localStorage.getItem(libraryKey))}catch{}if(!library||!Array.isArray(library.programs)){library={programs:starterPrograms,active:'fullbody'}}function saveLibrary(){localStorage.setItem(libraryKey,JSON.stringify(library))}function activeProgram(){return library.programs.find(p=>p.id===library.active)||library.programs[0]}function findWorkout(id,programId){const p=library.programs.find(x=>x.id===programId)||activeProgram();return p.workouts.find(w=>w.id===id)}function workoutLabel(w){return w.name}function chooseProgram(id){if(session){alert('Finish your current workout before switching programmes.');return}library.active=id;saveLibrary();show('gym')}function createProgram(){const name=prompt('New programme name:');if(!name||!name.trim())return;const id='custom-'+Date.now();library.programs.push({id,name:name.trim().slice(0,70),workouts:[]});library.active=id;saveLibrary();show('gym')}function duplicateProgram(id){const p=library.programs.find(x=>x.id===id);if(!p)return;const copy=JSON.parse(JSON.stringify(p));copy.id='custom-'+Date.now();copy.name+=' (Copy)';copy.workouts.forEach((w,i)=>w.id='workout-'+i+'-'+Date.now());library.programs.push(copy);library.active=copy.id;saveLibrary();show('gym')}function renameProgram(){const p=activeProgram(),name=prompt('Programme name:',p.name);if(name&&name.trim()){p.name=name.trim().slice(0,70);saveLibrary();show('gym')}}function addWorkout(){const p=activeProgram(),name=prompt('Workout name:');if(!name||!name.trim())return;p.workouts.push({id:'workout-'+Date.now(),name:name.trim().slice(0,70),exercises:[]});saveLibrary();show('gym')}function renameWorkout(id){const w=findWorkout(id);if(!w)return;const name=prompt('Workout name:',w.name);if(name&&name.trim()){w.name=name.trim().slice(0,70);saveLibrary();show('gym')}}function addExercise(id){const w=findWorkout(id);if(!w)return;const name=prompt('Exercise name:');if(!name||!name.trim())return;const sets=Number(prompt('Number of sets:',3));if(!Number.isInteger(sets)||sets<1||sets>12)return alert('Enter 1–12 sets');const reps=prompt('Target reps:', '8–12');if(!reps||!reps.trim())return;w.exercises.push([name.trim().slice(0,80),sets,reps.trim().slice(0,30)]);saveLibrary();show('gym')}function editExercise(id,index){const w=findWorkout(id);if(!w||!w.exercises[index])return;const old=w.exercises[index],name=prompt('Exercise name:',old[0]);if(name===null||!name.trim())return;const sets=Number(prompt('Sets:',old[1]));if(!Number.isInteger(sets)||sets<1||sets>12)return alert('Enter 1–12 sets');const reps=prompt('Target reps:',old[2]);if(reps===null||!reps.trim())return;w.exercises[index]=[name.trim().slice(0,80),sets,reps.trim().slice(0,30)];saveLibrary();show('gym')}function deleteExercise(id,index){const w=findWorkout(id);if(w&&confirm('Remove this exercise from the routine? Existing logged sets will remain in history.')){w.exercises.splice(index,1);saveLibrary();show('gym')}}function deleteWorkout(id){const p=activeProgram();if(confirm('Remove this workout from the programme? Logged history will be kept.')){p.workouts=p.workouts.filter(w=>w.id!==id);saveLibrary();show('gym')}}function libraryHtml(){const p=activeProgram();return box('<h2>Workout Library</h2><label>Programme <select id="programSelect" onchange="chooseProgram(this.value)">'+library.programs.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===p.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></label><p><button onclick="createProgram()">+ New programme</button> <button onclick="duplicateProgram(\''+p.id+'\')">Duplicate</button> <button onclick="renameProgram()">Rename</button></p><p><small>Switch programmes without losing your logged workouts.</small></p>')+p.workouts.map(w=>box('<h3>'+esc(w.name)+'</h3><p><button onclick="startWorkout(\''+w.id+'\')">Start workout</button> <button onclick="renameWorkout(\''+w.id+'\')">Rename</button> <button class="danger" onclick="deleteWorkout(\''+w.id+'\')">Remove</button></p><table><tr><th>Exercise</th><th>Sets</th><th>Reps</th><th></th></tr>'+w.exercises.map((e,i)=>'<tr><td>'+esc(e[0])+'</td><td>'+e[1]+'</td><td>'+esc(e[2])+'</td><td><button onclick="editExercise(\''+w.id+'\','+i+')">Edit</button> <button class="danger" onclick="deleteExercise(\''+w.id+'\','+i+')">×</button></td></tr>').join('')+'</table><p><button onclick="addExercise(\''+w.id+'\')">+ Add exercise</button></p>')).join('')+box('<button class="primary" onclick="addWorkout()">+ Create custom workout</button>')};const plans=Object.fromEntries(Object.entries(routines).map(([day,items])=>[day,items.map(x=>x[0])]));function routineHtml(day){return !routines[day]?'':box('<h2>'+esc(routineName(day))+'</h2><p><small>First two weeks: use 2 sets for most exercises if needed. Stop if an exercise causes pain.</small></p><table><tr><th>Exercise</th><th>Sets</th><th>Reps</th></tr>'+routines[day].map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td></tr>').join('')+'</table>')};
const nameKey='fittrack-routine-names-v2';const defaultNames={'Monday':'Workout A — Full Body (Chest Focus)','Thursday':'Workout B — Full Body (Back & Shoulders Focus)'};let customNames;try{customNames=JSON.parse(localStorage.getItem(nameKey))||{}}catch{customNames={}}function routineName(day){return customNames[day]||defaultNames[day]||day}function editRoutineNames(){const a=prompt('Name for Workout A:',routineName('Monday'));if(a===null)return;const b=prompt('Name for Workout B:',routineName('Thursday'));if(b===null)return;if(!a.trim()||!b.trim()){alert('Both workout names are required.');return}customNames={'Monday':a.trim().slice(0,60),'Thursday':b.trim().slice(0,60)};localStorage.setItem(nameKey,JSON.stringify(customNames));show('gym')}const sessionKey='fittrack-session-v1';let session;try{session=JSON.parse(localStorage.getItem(sessionKey))}catch{session=null}function keepSession(){if(session)localStorage.setItem(sessionKey,JSON.stringify(session));else localStorage.removeItem(sessionKey)}function startWorkout(day){const w=findWorkout(day);if(!w)return;session={day,programId:activeProgram().id,date:today(),startedAt:Date.now(),snapshot:JSON.parse(JSON.stringify(w))};keepSession();show('gym')}function finishWorkout(){if(!session)return;if(!confirm('Finish this workout? Your logged sets will be kept.'))return;session=null;keepSession();show('dashboard')}function adjust(id,step){const el=document.getElementById(id);el.value=Math.max(0,Math.round((Number(el.value||0)+step)*10)/10);el.dispatchEvent(new Event('change'))}let restEnd=0,restTimer=null;function startRest(seconds=90){restEnd=Date.now()+seconds*1000;clearInterval(restTimer);restTimer=setInterval(updateRest,250);updateRest()}function updateRest(){const el=document.getElementById('restStatus');if(!el){clearInterval(restTimer);return}const n=Math.max(0,Math.ceil((restEnd-Date.now())/1000));el.textContent=n?'Rest: '+Math.floor(n/60)+':'+String(n%60).padStart(2,'0'):'Rest complete ✓';if(!n)clearInterval(restTimer)}function stopRest(){clearInterval(restTimer);restEnd=0;const el=document.getElementById('restStatus');if(el)el.textContent='Rest skipped'}function workoutLauncher(){const p=activeProgram();return box('<h2>Next workout</h2><p>'+esc(p.name)+'</p>'+p.workouts.map(w=>'<p><button class="primary" onclick="startWorkout(\''+w.id+'\')">Start '+esc(w.name)+'</button></p>').join('')+'<button onclick="show(\'gym\')">Manage workout library</button>')}function show(page){let h='';if(page==='dashboard'){let b=last(data.body);h=(session?box('<h2>Workout in progress</h2><p>'+esc(session.snapshot?.name||routineName(session.day))+' · '+esc(session.date)+'</p><button class="primary" onclick="show(\'gym\')">Resume workout</button>'):workoutLauncher())+box('<h2>Progress</h2><p>Latest weight: <b>'+(b?esc(b.weight)+' lb':'Not recorded')+'</b></p><p>Latest waist: <b>'+(b?esc(b.waist)+' in':'Not recorded')+'</b></p><p>Goal weight: 168 lb</p><p>Logged sets: '+data.gym.length+' · Activities: '+data.activity.length+'</p>')+box('<h2>Recent sessions</h2><ul>'+rows('gym',r=>esc(r.date)+' — '+esc(r.exercise)+' '+esc(r.sets)+' × '+esc(r.reps)+' @ '+esc(r.kg)+' kg')+'</ul>')}
if(page==='progress'){h=box('<h2>Progress & measurements</h2><p>Track your weight and waist below.</p>')+box('<h2>Weight & waist</h2><form id="form">'+dateInput()+field('weight','Weight (lb)','number','step="0.1" min="1"')+field('waist','Waist (inches)','number','step="0.1" min="1"')+'<button>Save measurements</button></form>')+box('<h2>History</h2><ul>'+rows('body',r=>esc(r.date)+' — '+esc(r.weight)+' lb · '+esc(r.waist)+' in')+'</ul>');}if(page==='body'){h=box('<h2>Weight & waist</h2><form id="form">'+dateInput()+field('weight','Weight (lb)','number','step="0.1" min="1"')+field('waist','Waist (inches)','number','step="0.1" min="1"')+'<button>Save measurements</button></form>')+box('<h2>History</h2><ul>'+rows('body',r=>esc(r.date)+' — '+esc(r.weight)+' lb · '+esc(r.waist)+' in')+'</ul>');}
if(page==='gym'){if(!session){h=libraryHtml()}else{h=box('<h2>'+esc(session.snapshot?.name||routineName(session.day))+'</h2><p>'+esc(session.date)+' · Session in progress</p><div id="sessionProgress"></div><div class="sticky"><span id="restStatus">Rest timer ready</span> <button onclick="startRest(60)">60s</button> <button onclick="startRest(90)">90s</button> <button onclick="startRest(120)">120s</button> <button onclick="stopRest()">Skip</button></div><p><button class="primary" onclick="finishWorkout()">Finish workout</button></p>')+'<input type="hidden" id="day" value="'+esc(session.day)+'"><input type="hidden" id="workoutDate" value="'+esc(session.date)+'"><div id="workout"></div>'}h+=box('<h2>Previous logged sets</h2><ul>'+rows('gym',r=>esc(r.date)+' — '+esc(r.workoutName||routineName(r.day))+': '+esc(r.exercise)+' · '+(r.setNumber?'Set '+esc(r.setNumber)+': ':'')+esc(r.reps)+' reps @ '+esc(r.kg)+' kg')+'</ul>');}
if(page==='activity'){h=box('<h2>Log activity</h2><form id="form">'+dateInput()+field('name','Activity','text','value="Football"')+field('minutes','Duration (minutes)','number','min="1"')+'<button>Save activity</button></form>')+box('<h2>Activity history</h2><ul>'+rows('activity',r=>esc(r.date)+' — '+esc(r.name)+' · '+esc(r.minutes)+' minutes')+'</ul>');}
if(page==='settings'){h=box('<h2>Settings</h2><p>Your data is stored on this device. Back up regularly before clearing browser data or changing phones.</p><button onclick="exportData()">Export JSON backup</button><label>Restore JSON backup <input id="restore" type="file" accept="application/json,.json"></label><p><small>Restoring replaces existing logs and, if included, your workout library.</small></p>');}if(page==='backup'){h=box('<h2>Back up your data</h2><p>Everything is saved in this browser on this device. Clearing site data or changing phones can erase it. Export a backup regularly.</p><button onclick="exportData()">Export JSON backup</button><label>Restore JSON backup <input id="restore" type="file" accept="application/json,.json"></label><p><small>Restoring replaces all existing entries.</small></p>');}
document.getElementById('view').innerHTML=h;let f=document.getElementById('form');if(f)f.onsubmit=e=>{e.preventDefault();if(page==='body'||page==='progress')add('body',{date:val('date'),weight:number('weight'),waist:number('waist')});if(page==='activity')add('activity',{date:val('date'),name:val('name'),minutes:number('minutes')})};if(page==='gym'&&session)renderWorkout();if(page==='backup'||page==='settings')document.getElementById('restore').onchange=restoreData;}
function renderWorkout(){const day=val('day'),date=val('workoutDate');const list=session.snapshot?.exercises||routines[day]||[];const completed=data.gym.filter(r=>r.date===date&&r.day===day&&(!r.programId||r.programId===session.programId)&&r.setNumber).length;const total=list.reduce((sum,x)=>sum+x[1],0);const p=document.getElementById('sessionProgress');if(p)p.innerHTML='<p>'+completed+' of '+total+' sets completed</p><div class="progress"><span style="width:'+Math.min(100,100*completed/total)+'%"></span></div>';document.getElementById('workout').innerHTML=list.map(([name,count,range])=>{const prior=[...data.gym].reverse().find(r=>r.exercise===name&&r.date!==date);const done=data.gym.filter(r=>r.date===date&&r.day===day&&(!r.programId||r.programId===session.programId)&&r.exercise===name&&r.setNumber);const previous=prior?'Last time: '+esc(prior.reps)+' reps @ '+esc(prior.kg)+' kg':'No previous sets';return '<section><h3>'+esc(name)+'</h3><small>'+count+' sets · target '+range+' · '+previous+'</small>'+Array.from({length:count},(_,i)=>{const existing=done.find(r=>r.setNumber===i+1);const kg=existing?existing.kg:(prior?prior.kg:0);const reps=existing?existing.reps:(prior?prior.reps:0);return '<div style="display:flex;align-items:end;gap:7px;flex-wrap:wrap;margin:12px 0"><b>Set '+(i+1)+'</b><label>Reps<input style="width:70px" id="reps-'+day+'-'+list.indexOf(list.find(x=>x[0]===name))+'-'+i+'" type="number" min="0" step="1" value="'+reps+'"></label><label>kg<input style="width:80px" id="kg-'+day+'-'+list.indexOf(list.find(x=>x[0]===name))+'-'+i+'" type="number" min="0" step="0.5" value="'+kg+'"></label><button style="background:'+(existing?'#537b56':'#b2f27c')+'" onclick="saveSet(\''+day+'\','+list.findIndex(x=>x[0]===name)+','+i+')">'+(existing?'✓ Done':'✓ Log set')+'</button></div>'}).join('')+'</section>'}).join('');}
function saveSet(day,exerciseIndex,setIndex){const date=val('workoutDate'),exercise=(session.snapshot?.exercises||routines[day])[exerciseIndex][0],suffix=day+'-'+exerciseIndex+'-'+setIndex;const repsInput=document.getElementById('reps-'+suffix),kgInput=document.getElementById('kg-'+suffix);if(repsInput.value===''||kgInput.value===''||Number(repsInput.value)<0||Number(kgInput.value)<0){alert('Enter reps and weight (use 0 kg for bodyweight exercises).');return}const reps=Number(repsInput.value),kg=Number(kgInput.value);let existing=data.gym.find(r=>r.date===date&&r.day===day&&(!r.programId||r.programId===session.programId)&&r.exercise===exercise&&r.setNumber===setIndex+1);if(existing){existing.reps=reps;existing.kg=kg}else data.gym.push({date,day,programId:session.programId,workoutName:session.snapshot?.name||routineName(day),exercise,setNumber:setIndex+1,sets:1,reps,kg});data.gym.sort((a,b)=>a.date.localeCompare(b.date));save();show('gym');startRest(90);}
function setExercises(){let d=val('day');document.getElementById('exercise-options').innerHTML=(plans[d]||[]).map(x=>'<option value="'+esc(x)+'"></option>').join('');}
function exportData(){let blob=new Blob([JSON.stringify({...data,workoutLibrary:library},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fittrack-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function restoreData(e){try{let d=JSON.parse(await e.target.files[0].text());if(!['body','gym','activity'].every(k=>Array.isArray(d[k])))throw Error('Invalid FitTrack backup');if(confirm('Replace existing data with this backup?')){data={body:d.body,gym:d.gym,activity:d.activity};save();if(d.workoutLibrary&&Array.isArray(d.workoutLibrary.programs)){library=d.workoutLibrary;saveLibrary()}show('dashboard')}}catch(err){alert(err.message)}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});show('dashboard');
</script></body></html>
