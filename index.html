<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10251d"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>FitTrack</title><style>body{font:16px system-ui;background:#0d1814;color:#eaf7ee;margin:0}main{max-width:650px;margin:auto;padding:18px}h1{color:#a7f36b}nav{display:flex;gap:8px;flex-wrap:wrap}button{background:#b2f27c;color:#142216;border:0;border-radius:10px;padding:12px;font-weight:bold;cursor:pointer}nav button{background:#263c30;color:white}section{background:#192b22;border-radius:15px;padding:18px;margin:16px 0}input,select{background:#edf4ef;color:#10251d;border:0;border-radius:8px;padding:12px;max-width:95%;box-sizing:border-box}label{display:block;margin:10px 0}small{color:#bdd0c2}li{margin:12px 0}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #405747;padding:8px;text-align:left} .danger{background:#eab3a8}canvas{width:100%;height:180px}.primary{width:100%;font-size:17px;padding:16px}.muted{color:#bdd0c2}.counter{display:flex;align-items:center;gap:5px}.counter button{padding:10px}.counter input{width:70px;text-align:center}.progress{height:12px;background:#304638;border-radius:12px;overflow:hidden}.progress span{display:block;height:100%;background:#b2f27c}.sticky{position:sticky;bottom:0;background:#10251d;padding:12px;border-radius:12px;z-index:2}</style></head><body><main><h1>💪 FitTrack</h1><p>Your private fitness log · saved on this device</p><nav><button onclick="show('dashboard')">Dashboard</button><button onclick="show('body')">Measurements</button><button onclick="show('gym')">Gym</button><button onclick="show('activity')">Activity</button><button onclick="show('backup')">Backup</button></nav><div id="view"></div></main><script>
const key='fittrack-v1';let data;try{data=JSON.parse(localStorage.getItem(key))||{body:[],gym:[],activity:[]}}catch{data={body:[],gym:[],activity:[]}};const save=()=>localStorage.setItem(key,JSON.stringify(data));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('en-CA');const box=(s)=>'<section>'+s+'</section>';const last=a=>a.length?a[a.length-1]:null;const dateInput=()=>'<label>Date <input id="date" type="date" value="'+today()+'"></label>';const field=(id,label,type='number',extra='')=>'<label>'+label+' <input id="'+id+'" type="'+type+'" '+extra+' required></label>';const val=id=>document.getElementById(id).value;const number=id=>Number(val(id));function add(kind,record){data[kind].push(record);data[kind].sort((a,b)=>a.date.localeCompare(b.date));save();show(kind==='body'?'body':kind==='gym'?'gym':'activity')}function remove(kind,i){if(confirm('Delete this entry?')){data[kind].splice(i,1);save();show(kind)}}function rows(kind,format){return [...data[kind]].reverse().map((r,j)=>'<li>'+format(r)+' <button class="danger" onclick="remove(\''+kind+'\','+(data[kind].length-1-j)+')">Delete</button></li>').join('')||'<p>No entries yet.</p>'}
const routines={'Monday':[['Leg press',3,'8–12'],['Chest press machine',3,'8–12'],['Lat pulldown',3,'8–12'],['Romanian deadlift (dumbbells)',2,'8–12'],['Incline dumbbell press',2,'8–12'],['Seated cable row',2,'10–12'],['Tricep rope pushdown',2,'10–15'],['Cable crunches',2,'12–15']],'Thursday':[['Goblet squat',3,'8–12'],['Leg curl machine',3,'10–15'],['Seated cable row',3,'8–12'],['Shoulder press machine',3,'8–12'],['Lat pulldown',2,'8–12'],['Chest press machine',2,'10–12'],['Dumbbell bicep curls',2,'10–12'],['Standing calf raises',2,'12–15']]};const plans=Object.fromEntries(Object.entries(routines).map(([day,items])=>[day,items.map(x=>x[0])]));function routineHtml(day){return !routines[day]?'':box('<h2>'+esc(routineName(day))+'</h2><p><small>First two weeks: use 2 sets for most exercises if needed. Stop if an exercise causes pain.</small></p><table><tr><th>Exercise</th><th>Sets</th><th>Reps</th></tr>'+routines[day].map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td></tr>').join('')+'</table>')};
const nameKey='fittrack-routine-names-v2';const defaultNames={'Monday':'Workout A — Full Body (Chest Focus)','Thursday':'Workout B — Full Body (Back & Shoulders Focus)'};let customNames;try{customNames=JSON.parse(localStorage.getItem(nameKey))||{}}catch{customNames={}}function routineName(day){return customNames[day]||defaultNames[day]||day}function editRoutineNames(){const a=prompt('Name for Workout A:',routineName('Monday'));if(a===null)return;const b=prompt('Name for Workout B:',routineName('Thursday'));if(b===null)return;if(!a.trim()||!b.trim()){alert('Both workout names are required.');return}customNames={'Monday':a.trim().slice(0,60),'Thursday':b.trim().slice(0,60)};localStorage.setItem(nameKey,JSON.stringify(customNames));show('gym')}const sessionKey='fittrack-session-v1';let session;try{session=JSON.parse(localStorage.getItem(sessionKey))}catch{session=null}function keepSession(){if(session)localStorage.setItem(sessionKey,JSON.stringify(session));else localStorage.removeItem(sessionKey)}function startWorkout(day){session={day,date:today(),startedAt:Date.now()};keepSession();show('gym')}function finishWorkout(){if(!session)return;if(!confirm('Finish this workout? Your logged sets will be kept.'))return;session=null;keepSession();show('dashboard')}function adjust(id,step){const el=document.getElementById(id);el.value=Math.max(0,Math.round((Number(el.value||0)+step)*10)/10);el.dispatchEvent(new Event('change'))}let restEnd=0,restTimer=null;function startRest(seconds=90){restEnd=Date.now()+seconds*1000;clearInterval(restTimer);restTimer=setInterval(updateRest,250);updateRest()}function updateRest(){const el=document.getElementById('restStatus');if(!el){clearInterval(restTimer);return}const n=Math.max(0,Math.ceil((restEnd-Date.now())/1000));el.textContent=n?'Rest: '+Math.floor(n/60)+':'+String(n%60).padStart(2,'0'):'Rest complete ✓';if(!n)clearInterval(restTimer)}function stopRest(){clearInterval(restTimer);restEnd=0;const el=document.getElementById('restStatus');if(el)el.textContent='Rest skipped'}function workoutLauncher(){return box('<h2>Choose your workout</h2><p>Choose a routine to start. Your completed sets will be saved automatically.</p><button class="primary" onclick="startWorkout(\'Monday\')">Start Monday · Upper A</button><p></p><button class="primary" onclick="startWorkout(\'Thursday\')">Start Thursday · Upper B</button>')}function show(page){let h='';if(page==='dashboard'){let b=last(data.body);h=(session?box('<h2>Workout in progress</h2><p>'+esc(routineName(session.day))+' · '+esc(session.date)+'</p><button class="primary" onclick="show(\'gym\')">Resume workout</button>'):workoutLauncher())+box('<h2>Progress</h2><p>Latest weight: <b>'+(b?esc(b.weight)+' lb':'Not recorded')+'</b></p><p>Latest waist: <b>'+(b?esc(b.waist)+' in':'Not recorded')+'</b></p><p>Goal weight: 168 lb</p><p>Gym sessions: '+data.gym.length+' · Activities: '+data.activity.length+'</p>')+box('<h2>Recent sessions</h2><ul>'+rows('gym',r=>esc(r.date)+' — '+esc(r.exercise)+' '+esc(r.sets)+' × '+esc(r.reps)+' @ '+esc(r.kg)+' kg')+'</ul>')}
if(page==='body'){h=box('<h2>Weight & waist</h2><form id="form">'+dateInput()+field('weight','Weight (lb)','number','step="0.1" min="1"')+field('waist','Waist (inches)','number','step="0.1" min="1"')+'<button>Save measurements</button></form>')+box('<h2>History</h2><ul>'+rows('body',r=>esc(r.date)+' — '+esc(r.weight)+' lb · '+esc(r.waist)+' in')+'</ul>');}
if(page==='gym'){if(!session){h=workoutLauncher()+box('<button onclick="editRoutineNames()">Rename workouts</button><p><small>Workout names are saved on this device. Your existing exercise history stays linked to the same routines.</small></p>')+routineHtml('Monday')+routineHtml('Thursday')}else{h=box('<h2>'+esc(routineName(session.day))+'</h2><p>'+esc(session.date)+' · Session in progress</p><div id="sessionProgress"></div><div class="sticky"><span id="restStatus">Rest timer ready</span> <button onclick="startRest(60)">60s</button> <button onclick="startRest(90)">90s</button> <button onclick="startRest(120)">120s</button> <button onclick="stopRest()">Skip</button></div><p><button class="primary" onclick="finishWorkout()">Finish workout</button></p>')+'<input type="hidden" id="day" value="'+esc(session.day)+'"><input type="hidden" id="workoutDate" value="'+esc(session.date)+'"><div id="workout"></div>'}h+=box('<h2>Previous logged sets</h2><ul>'+rows('gym',r=>esc(r.date)+' — '+esc(routineName(r.day))+': '+esc(r.exercise)+' · '+(r.setNumber?'Set '+esc(r.setNumber)+': ':'')+esc(r.reps)+' reps @ '+esc(r.kg)+' kg')+'</ul>');}
if(page==='activity'){h=box('<h2>Log activity</h2><form id="form">'+dateInput()+field('name','Activity','text','value="Football"')+field('minutes','Duration (minutes)','number','min="1"')+'<button>Save activity</button></form>')+box('<h2>Activity history</h2><ul>'+rows('activity',r=>esc(r.date)+' — '+esc(r.name)+' · '+esc(r.minutes)+' minutes')+'</ul>');}
if(page==='backup'){h=box('<h2>Back up your data</h2><p>Everything is saved in this browser on this device. Clearing site data or changing phones can erase it. Export a backup regularly.</p><button onclick="exportData()">Export JSON backup</button><label>Restore JSON backup <input id="restore" type="file" accept="application/json,.json"></label><p><small>Restoring replaces all existing entries.</small></p>');}
document.getElementById('view').innerHTML=h;let f=document.getElementById('form');if(f)f.onsubmit=e=>{e.preventDefault();if(page==='body')add('body',{date:val('date'),weight:number('weight'),waist:number('waist')});if(page==='activity')add('activity',{date:val('date'),name:val('name'),minutes:number('minutes')})};if(page==='gym'&&session)renderWorkout();if(page==='backup')document.getElementById('restore').onchange=restoreData;}
function renderWorkout(){const day=val('day'),date=val('workoutDate');const list=routines[day]||[];const completed=data.gym.filter(r=>r.date===date&&r.day===day&&r.setNumber).length;const total=list.reduce((sum,x)=>sum+x[1],0);const p=document.getElementById('sessionProgress');if(p)p.innerHTML='<p>'+completed+' of '+total+' sets completed</p><div class="progress"><span style="width:'+Math.min(100,100*completed/total)+'%"></span></div>';document.getElementById('workout').innerHTML=list.map(([name,count,range])=>{const prior=[...data.gym].reverse().find(r=>r.exercise===name&&r.date!==date);const done=data.gym.filter(r=>r.date===date&&r.day===day&&r.exercise===name&&r.setNumber);const previous=prior?'Last time: '+esc(prior.reps)+' reps @ '+esc(prior.kg)+' kg':'No previous sets';return '<section><h3>'+esc(name)+'</h3><small>'+count+' sets · target '+range+' · '+previous+'</small>'+Array.from({length:count},(_,i)=>{const existing=done.find(r=>r.setNumber===i+1);const kg=existing?existing.kg:(prior?prior.kg:0);const reps=existing?existing.reps:(prior?prior.reps:0);return '<div style="display:flex;align-items:end;gap:7px;flex-wrap:wrap;margin:12px 0"><b>Set '+(i+1)+'</b><label>Reps<input style="width:70px" id="reps-'+day+'-'+list.indexOf(list.find(x=>x[0]===name))+'-'+i+'" type="number" min="0" step="1" value="'+reps+'"></label><label>kg<input style="width:80px" id="kg-'+day+'-'+list.indexOf(list.find(x=>x[0]===name))+'-'+i+'" type="number" min="0" step="0.5" value="'+kg+'"></label><button style="background:'+(existing?'#537b56':'#b2f27c')+'" onclick="saveSet(\''+day+'\','+list.findIndex(x=>x[0]===name)+','+i+')">'+(existing?'✓ Done':'✓ Log set')+'</button></div>'}).join('')+'</section>'}).join('');}
function saveSet(day,exerciseIndex,setIndex){const date=val('workoutDate'),exercise=routines[day][exerciseIndex][0],suffix=day+'-'+exerciseIndex+'-'+setIndex;const repsInput=document.getElementById('reps-'+suffix),kgInput=document.getElementById('kg-'+suffix);if(repsInput.value===''||kgInput.value===''||Number(repsInput.value)<0||Number(kgInput.value)<0){alert('Enter reps and weight (use 0 kg for bodyweight exercises).');return}const reps=Number(repsInput.value),kg=Number(kgInput.value);let existing=data.gym.find(r=>r.date===date&&r.day===day&&r.exercise===exercise&&r.setNumber===setIndex+1);if(existing){existing.reps=reps;existing.kg=kg}else data.gym.push({date,day,exercise,setNumber:setIndex+1,sets:1,reps,kg});data.gym.sort((a,b)=>a.date.localeCompare(b.date));save();show('gym');startRest(90);}
function setExercises(){let d=val('day');document.getElementById('exercise-options').innerHTML=(plans[d]||[]).map(x=>'<option value="'+esc(x)+'"></option>').join('');}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fittrack-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function restoreData(e){try{let d=JSON.parse(await e.target.files[0].text());if(!['body','gym','activity'].every(k=>Array.isArray(d[k])))throw Error('Invalid FitTrack backup');if(confirm('Replace existing data with this backup?')){data=d;save();show('dashboard')}}catch(err){alert(err.message)}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});show('dashboard');
</script></body></html>
