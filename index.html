<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10251d"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>FitTrack</title><style>body{font:16px system-ui;background:#0d1814;color:#eaf7ee;margin:0}main{max-width:650px;margin:auto;padding:18px}h1{color:#a7f36b}nav{display:flex;gap:8px;flex-wrap:wrap}button{background:#b2f27c;color:#142216;border:0;border-radius:10px;padding:12px;font-weight:bold;cursor:pointer}nav button{background:#263c30;color:white}section{background:#192b22;border-radius:15px;padding:18px;margin:16px 0}input,select{background:#edf4ef;color:#10251d;border:0;border-radius:8px;padding:12px;max-width:95%;box-sizing:border-box}label{display:block;margin:10px 0}small{color:#bdd0c2}li{margin:12px 0}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #405747;padding:8px;text-align:left} .danger{background:#eab3a8}canvas{width:100%;height:180px}</style></head><body><main><h1>💪 FitTrack</h1><p>Your private fitness log · saved on this device</p><nav><button onclick="show('dashboard')">Dashboard</button><button onclick="show('body')">Measurements</button><button onclick="show('gym')">Gym</button><button onclick="show('activity')">Activity</button><button onclick="show('backup')">Backup</button></nav><div id="view"></div></main><script>
const key='fittrack-v1';let data;try{data=JSON.parse(localStorage.getItem(key))||{body:[],gym:[],activity:[]}}catch{data={body:[],gym:[],activity:[]}};const save=()=>localStorage.setItem(key,JSON.stringify(data));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('en-CA');const box=(s)=>'<section>'+s+'</section>';const last=a=>a.length?a[a.length-1]:null;const dateInput=()=>'<label>Date <input id="date" type="date" value="'+today()+'"></label>';const field=(id,label,type='number',extra='')=>'<label>'+label+' <input id="'+id+'" type="'+type+'" '+extra+' required></label>';const val=id=>document.getElementById(id).value;const number=id=>Number(val(id));function add(kind,record){data[kind].push(record);data[kind].sort((a,b)=>a.date.localeCompare(b.date));save();show(kind==='body'?'body':kind==='gym'?'gym':'activity')}function remove(kind,i){if(confirm('Delete this entry?')){data[kind].splice(i,1);save();show(kind)}}function rows(kind,format){return [...data[kind]].reverse().map((r,j)=>'<li>'+format(r)+' <button class="danger" onclick="remove(\''+kind+'\','+(data[kind].length-1-j)+')">Delete</button></li>').join('')||'<p>No entries yet.</p>'}
const routines={'Monday':[['Chest press machine',3,'8–12'],['Lat pulldown',3,'8–12'],['Incline dumbbell press',3,'8–12'],['Seated cable row',3,'10–12'],['Dumbbell lateral raises',3,'12–15'],['Tricep rope pushdown',3,'10–15'],['Dumbbell bicep curls',3,'10–12'],['Leg press',2,'10–12']],'Thursday':[['Lat pulldown',3,'8–12'],['Shoulder press machine',3,'8–12'],['Seated cable row',3,'8–12'],['Chest press machine',3,'10–12'],['Hammer curls',3,'10–12'],['Overhead cable tricep extensions',3,'10–15'],['Leg curl machine',2,'10–15'],['Cable crunches',3,'12–15'],['Plank',3,'30–45 sec']]};const plans=Object.fromEntries(Object.entries(routines).map(([day,items])=>[day,items.map(x=>x[0])]));function routineHtml(day){return !routines[day]?'':box('<h2>'+day+' routine</h2><p><small>First two weeks: use 2 sets for most exercises if needed. Stop if an exercise causes pain.</small></p><table><tr><th>Exercise</th><th>Sets</th><th>Reps</th></tr>'+routines[day].map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td></tr>').join('')+'</table>')};
function show(page){let h='';if(page==='dashboard'){let b=last(data.body);h=box('<h2>Progress</h2><p>Latest weight: <b>'+(b?esc(b.weight)+' lb':'Not recorded')+'</b></p><p>Latest waist: <b>'+(b?esc(b.waist)+' in':'Not recorded')+'</b></p><p>Goal weight: 168 lb</p><p>Gym sessions: '+data.gym.length+' · Activities: '+data.activity.length+'</p>')+box('<h2>Recent sessions</h2><ul>'+rows('gym',r=>esc(r.date)+' — '+esc(r.exercise)+' '+esc(r.sets)+' × '+esc(r.reps)+' @ '+esc(r.kg)+' kg')+'</ul>')}
if(page==='body'){h=box('<h2>Weight & waist</h2><form id="form">'+dateInput()+field('weight','Weight (lb)','number','step="0.1" min="1"')+field('waist','Waist (inches)','number','step="0.1" min="1"')+'<button>Save measurements</button></form>')+box('<h2>History</h2><ul>'+rows('body',r=>esc(r.date)+' — '+esc(r.weight)+' lb · '+esc(r.waist)+' in')+'</ul>');}
if(page==='gym'){h=routineHtml('Monday')+routineHtml('Thursday')+box('<h2>Log a gym exercise</h2><p>Monday & Thursday — record each exercise separately.</p><label>Workout <select id="day" onchange="setExercises()"><option>Monday</option><option>Thursday</option><option>Other</option></select></label><form id="form">'+dateInput()+'<label>Exercise <input id="exercise" list="exercise-options" required><datalist id="exercise-options"></datalist></label>'+field('sets','Sets','number','min="1"')+field('reps','Reps per set','number','min="1"')+field('kg','Weight (kg)','number','step="0.5" min="0"')+'<button>Save exercise</button></form>')+box('<h2>Exercise history</h2><ul>'+rows('gym',r=>esc(r.date)+' — '+esc(r.day)+': '+esc(r.exercise)+' · '+esc(r.sets)+' × '+esc(r.reps)+' @ '+esc(r.kg)+' kg')+'</ul>');}
if(page==='activity'){h=box('<h2>Log activity</h2><form id="form">'+dateInput()+field('name','Activity','text','value="Football"')+field('minutes','Duration (minutes)','number','min="1"')+'<button>Save activity</button></form>')+box('<h2>Activity history</h2><ul>'+rows('activity',r=>esc(r.date)+' — '+esc(r.name)+' · '+esc(r.minutes)+' minutes')+'</ul>');}
if(page==='backup'){h=box('<h2>Back up your data</h2><p>Everything is saved in this browser on this device. Clearing site data or changing phones can erase it. Export a backup regularly.</p><button onclick="exportData()">Export JSON backup</button><label>Restore JSON backup <input id="restore" type="file" accept="application/json,.json"></label><p><small>Restoring replaces all existing entries.</small></p>');}
document.getElementById('view').innerHTML=h;let f=document.getElementById('form');if(f)f.onsubmit=e=>{e.preventDefault();if(page==='body')add('body',{date:val('date'),weight:number('weight'),waist:number('waist')});if(page==='gym')add('gym',{date:val('date'),day:val('day'),exercise:val('exercise'),sets:number('sets'),reps:number('reps'),kg:number('kg')});if(page==='activity')add('activity',{date:val('date'),name:val('name'),minutes:number('minutes')})};if(page==='gym')setExercises();if(page==='backup')document.getElementById('restore').onchange=restoreData;}
function setExercises(){let d=val('day');document.getElementById('exercise-options').innerHTML=(plans[d]||[]).map(x=>'<option value="'+esc(x)+'"></option>').join('');}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fittrack-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function restoreData(e){try{let d=JSON.parse(await e.target.files[0].text());if(!['body','gym','activity'].every(k=>Array.isArray(d[k])))throw Error('Invalid FitTrack backup');if(confirm('Replace existing data with this backup?')){data=d;save();show('dashboard')}}catch(err){alert(err.message)}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});show('dashboard');
</script></body></html>
