const key='fittrack-v1';let data;try{data=JSON.parse(localStorage.getItem(key))||{body:[],gym:[],activity:[]}}catch{data={body:[],gym:[],activity:[]}};if(!Array.isArray(data.sessions))data.sessions=[];const save=()=>localStorage.setItem(key,JSON.stringify(data));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('en-CA');const box=(s)=>'<section>'+s+'</section>';const last=a=>a.length?a[a.length-1]:null;const dateInput=()=>'<label>Date <input id="date" type="date" value="'+today()+'"></label>';const field=(id,label,type='number',extra='')=>'<label>'+label+' <input id="'+id+'" type="'+type+'" '+extra+' required></label>';const val=id=>document.getElementById(id).value;const number=id=>Number(val(id));function add(kind,record){data[kind].push(record);data[kind].sort((a,b)=>a.date.localeCompare(b.date));save();show(kind==='body'?'progress':kind==='gym'?'gym':'activity')}function remove(kind,i){if(confirm('Delete this entry?')){data[kind].splice(i,1);save();show(kind)}}function rows(kind,format){return [...data[kind]].reverse().map((r,j)=>'<li>'+format(r)+' <button class="danger" onclick="remove(\''+kind+'\','+(data[kind].length-1-j)+')">Delete</button></li>').join('')||'<p>No entries yet.</p>'}

2'],['Shoulder press machine',3,'8–12'],['Tricep rope pushdown',3,'10–15']]},{id:'pplpull',name:'Pull',exercises:[['Lat pulldown',3,'8–12'],['Seated cable row',3,'8–12'],['Dumbbell bicep curls',3,'10–12'],['Hammer curls',2,'10–12']]},{id:'ppllegs',name:'Legs',exercises:[['Leg press',3,'8–12'],['Romanian deadlift (dumbbells)',3,'8–12'],['Leg curl machine',3,'10–15'],['Standing calf raises',3,'12–15']]}]}];let library;try{library=JSON.parse(localStorage.getItem(libraryKey))}catch{}if(!library||!Array.isArray(library.programs)){library={programs:starterPrograms,active:'fullbody'}}function saveLibrary(){localStorage.setItem(libraryKey,JSON.stringify(library))}function activeProgram(){return library.programs.find(p=>p.id===library.active)||library.programs[0]}function findWorkout(id,programId){const p=library.programs.find(x=>x.id===programId)||activeProgram();return p.workouts.find(w=>w.id===id)}function workoutLabel(w){return w.name}function chooseProgram(id){if(session){alert('Finish your current workout before switching programmes.');return}library.active=id;saveLibrary();show('gym')}function createProgram(){const name=prompt('New programme name:');if(!name||!name.trim())return;const id='custom-'+Date.now();library.programs.push({id,name:name.trim().slice(0,70),workouts:[]});library.active=id;saveLibrary();show('gym')}function duplicateProgram(id){const p=library.programs.find(x=>x.id===id);if(!p)return;const copy=JSON.parse(JSON.stringify(p));copy.id='custom-'+Date.now();copy.name+=' (Copy)';copy.workouts.forEach((w,i)=>w.id='workout-'+i+'-'+Date.now());library.programs.push(copy);library.active=copy.id;saveLibrary();show('gym')}function renameProgram(){const p=activeProgram(),name=prompt('Programme name:',p.name);if(name&&name.trim()){p.name=name.trim().slice(0,70);saveLibrary();show('gym')}}function addWorkout(){const p=activeProgram(),name=prompt('Workout name:');if(!name||!name.trim())return;p.workouts.push({id:'workout-'+Date.now(),name:name.trim().slice(0,70), er()">Cancel</button></section>'}function libraryHtml(){const p=activeProgram();return exercisePickerHtml()+box('<h2>Workout Library</h2><label>Programme <select id="programSelect" onchange="chooseProgram(this.value)">'+library.programs.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===p.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></label><p><button onclick="createProgram()">+ New programme</button> <button onclick="duplicateProgram(\''+p.id+'\')">Duplicate</button> <button onclick="renameProgram()">Rename</button></p><p><small>Switch programmes without losing your logged workouts.</small></p>')+p.workouts.map(w=>box('<h3>'+esc(w.name)+'</h3><p><button onclick="startWorkout(\''+w.id+'\')">Start workout</button> <button onclick="renameWorkout(\''+w.id+'\')">Rename</button> <button class="danger" onclick="deleteWorkout(\''+w.id+'\')">Remove</button></p><table><tr><th>Exercise</th><th>Sets</th><th>Reps</th><th></th></tr>'+w.exercises.map((e,i)=>'<tr><td>'+esc(e[0])+'</td><td>'+e[1]+'</td><td>'+esc(e[2])+'</td><td><button onclick="editExercise(\''+w.id+'\','+i+')">Edit</button> <button class="danger" onclick="deleteExercise(\''+w.id+'\','+i+')">×</button></td></tr>').join('')+'</table><p><button onclick="addExercise(\''+w.id+'\')">+ Add exercise</button></p>')).join('')+box('<button class="primary" onclick="addWorkout()">+ Create custom workout</button>')};const plans=Object.fromEntries(Object.entries(routines).map(([day,items])=>[day,items.map(x=>x[0])]));function routineHtml(day){return !routines[day]?'':box('<h2>'+esc(routineName(day))+'</h2><p><small>First two weeks: use 2 sets for most exercises if needed. Stop if an exercise causes pain.</small></p><table><tr><th>Exercise</th><th>Sets</th><th>Reps</th></tr>'+routines[day].map(x=>'<tr><td>'+esc(x[0])+'</td><td>'+x[1]+'</td><td>'+x[2]+'</td></tr>').join('')+'</table>')};
const nameKey='fittrack-routine-names-v2';const defaultNames={'Monday':'Workout A — Full Body (Chest Focus)','Thursday':'Workout B — Full Body (Back & Shoulders Focus)'};let customNames;try{customNames=JSON.parse(localStorage.getItem(nameKey))||{}}catch{customNames={}}function routineName(day){return customNames[day]||defaultNames[day]||day}function editRoutineNames(){const a=prompt('Name for Workout A:',routineName('Monday'));if(a===null)return;const b=prompt('Name for Workout B:',routineName('Thursday'));if(b===null)return;if(!a.trim()||!b.trim()){alert('Both workout names are required.');return}customNames={'Monday':a.trim().slice(0,60),'Thursday':b.trim().slice(0,60)};localStorage.setItem(nameKey,JSON.stringify(customNames));show('gym')}const sessionKey='fittrack-session-v1';let session;try{session=JSON.parse(localStorage.getItem(sessionKey))}catch{session=null}function keepSession(){if(session)localStorage.setItem(sessionKey,JSON.stringify(session));else localStorage.removeItem(sessionKey)}function startWorkout(day){const w=findWorkout(day);if(!w)return;if(!w.exercises||!w.exercises.length){alert('This workout has no exercises yet. Add an exercise from the Workout Library before starting.');return}session={id:'session-'+Date.now(),day,programId:activeProgram().id,date:today(),startedAt:Date.now(),snapshot:JSON.parse(JSON.stringify(w))};keepSession();show('gym')}function finishWorkout(){if(!session)return;if(!confirm('Finish this workout? Your logged sets will be kept.'))return;const entries=data.gym.filter(r=>r.sessionId===session.id);const record={id:session.id||'session-'+Date.now(),day:session.day,programId:session.programId,date:session.date,name:session.snapshot?.name||routineName(session.day),startedAt:session.startedAt||Date.now(),finishedAt:Date.now(),sets:entries.map(r=>({...r}))};data.sessions.push(record);save();session=null;keepSession();show('progress')}function sessionHistory(){const grouped=new Map();for(const r of data.gym){if(data.sessions.some(s=>(s.sets||[]).some(x=>x.sessionId?x.sessionId===r.sessionId:x.date===r.date&&x.day===r.day&&x.exercise===r.exercise&&x.setNumber===r.setNumber)))continue;const id=r.sessionId||[r.date,r.day,r.programId||'legacy'].join('|');if(!grouped.has(id))grouped.set(id,{id,date:r.date,day:r.day,name:r.workoutName||routineName(r.day),sets:[],startedAt:0,finishedAt:0});grouped.get(id).sets.push(r)}const all=[...data.sessions,...grouped.values()].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.finishedAt||0)-(a.finishedAt||0));return box('<h2>Completed workouts ('+all.length+')</h2>'+(all.length?all.map(s=>'<details class="history-session"><summary><strong>'+esc(s.name||routineName(s.day))+'</strong><br><small>'+esc(s.date)+' · '+(s.sets||[]).length+' sets'+(s.startedAt&&s.finishedAt?' · '+Math.round((s.finishedAt-s.startedAt)/60000)+' min':' · Earlier logs')+'</small></summary><ul>'+(s.sets||[]).map(r=>'<li>'+esc(r.exercise)+' — Set '+esc(r.setNumber||1)+': '+esc(r.reps)+' reps @ '+esc(r.kg)+' kg</li>').join('')+'</ul></details>').join(''):'<p class="muted">No finished workouts yet. Finish a workout to see it here.</p>'))}function adjust(id,step){const el=document.getElementById(id);el.value=Math.max(0,Math.round((Number(el.value||0)+step)*10)/10);el.dispatchEvent(new Event('change'))}let restEnd=0,restTimer=null;function startRest(seconds=90){restEnd=Date.now()+seconds*1000;clearInterval(restTimer);restTimer=setInterval(updateRest,250);updateRest()}function updateRest(){const el=document.getElementById('restStatus');if(!el){clearInterval(restTimer);return}const n=Math.max(0,Math.ceil((restEnd-Date.now())/1000));el.textContent=n?'Rest: '+Math.floor(n/60)+':'+String(n%60).padStart(2,'0'):'Rest complete ✓';if(!n)clearInterval(restTimer)}function stopRest(){clearInterval(restTimer);restEnd=0;const el=document.getElementById('restStatus');if(el)el.textContent='Rest skipped'}function workoutLauncher(){const p=activeProgram();return box('<h2>Next workout</h2><p>'+esc(p.name)+'</p>'+p.workouts.map(w=>'<p><button class="primary" onclick="startWorkout(\''+w.id+'\')">Start '+esc(w.name)+'</button></p>').join('')+'<button onclick="show(\'gym\')">Manage workout library</button>')}function trendChart(records,field,unit){const byDate=new Map();for(const r of [...records].sort((a,b)=>a.date.localeCompare(b.date))){const n=Number(r[field]);if(r.date&&Number.isFinite(n)&&n>0)byDate.set(r.date,n)}const pts=[...byDate].slice(-30);if(!pts.length)return '<p class="muted">Add entries to see your progress.</p>';const vals=pts.map(p=>p[1]),min=Math.min(...vals),max=Math.max(...vals),pad=Math.max((max-min)*.15,.5),low=min-pad,high=max+pad;const xy=pts.map((p,i)=>[35+(pts.length===1?140:i*280/(pts.length-1)),155-(p[1]-low)/(high-low)*115]);const path=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');return '<svg viewBox="0 0 355 195" style="width:100%;height:auto" role="img" aria-label="'+esc(field)+' trend"><line x1="35" y1="155" x2="320" y2="155" stroke="#49614f"/><path d="'+path+'" fill="none" stroke="#b2f27c" stroke-width="3"/>'+xy.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="#b2f27c"/>').join('')+'<text x="35" y="180" fill="#bdd0c2" font-size="11">'+esc(pts[0][0])+'</text><text x="320" y="180" text-anchor="end" fill="#bdd0c2" font-size="11">'+esc(pts[pts.length-1][0])+'</text></svg><p>Latest: <b>'+vals[vals.length-1]+' '+unit+'</b> · Change: '+(vals[vals.length-1]-vals[0]).toFixed(1)+' '+unit+'</p>'}function strengthChart(){const names=[...new Set(data.gym.map(r=>r.exercise).filter(Boolean))].sort();if(!names.length)return box('<h2>Strength</h2><p class="muted">Log a workout to see strength trends.</p>');const name=names.includes(window.selectedLift)?window.selectedLift:names[0];const byDate=new Map();for(const r of data.gym.filter(r=>r.exercise===name)){const old=byDate.get(r.date);if(!old||Number(r.kg)>Number(old.kg))byDate.set(r.date,{date:r.date,kg:r.kg})}return box('<h2>Strength</h2><label>Exercise <select onchange="window.selectedLift=this.value;show(\'progress\')">'+names.map(n=>'<option '+(n===name?'selected':'')+'>'+esc(n)+'</option>').join('')+'</select></label>'+trendChart([...byDate.values()],'kg','kg')+'<small>Highest logged weight per day</small>')}function graphSections(){return box('<h2>Weight trend</h2>'+trendChart(data.body,'weight','lb'))+box('<h2>Waist trend</h2>'+trendChart(data.body,'waist','in'))+strengthChart()}function show(page){let h='';if(page==='dashboard'){let b=last(data.body);h=(session?box('<h2>Workout in progress</h2><p>'+esc(session.snapshot?.name||routineName(session.day))+' · '+esc(session.date)+'</p><button class="primary" onclick="show(\'gym\')">Resume workout</button>'):workoutLauncher())+box('<h2>Progress</h2><p>Latest weight: <b>'+(b?esc(b.weight)+' lb':'Not recorded')+'</b></p><p>Latest waist: <b>'+(b?esc(b.waist)+' in':'Not recorded')+'</b></p><p>Goal weight: 168 lb</p><p>Logged sets: '+data.gym.length+' · Activities: '+data.activity.length+'</p>')+box('<h2>Recent logged sets</h2><ul>'+rows('gym',r=>esc(r.date)+' — '+esc(r.exercise)+' '+esc(r.sets)+' × '+esc(r.reps)+' @ '+esc(r.kg)+' kg')+'</ul>')}
if(page==='progress'){h=box('<h2>Progress & measurements</h2><p>See your completed workouts, measurements and lifting progress.</p>')+sessionHistory()+graphSections()+box('<h2>Weight & waist</h2><form id="form">'+dateInput()+field('weight','Weight (lb)','number','step="0.1" min="1"')+field('waist','Waist (inches)','number','step="0.1" min="1"')+'<button>Save measurements</button></form>')+box('<h2>History</h2><ul>'+rows('body',r=>esc(r.date)+' — '+esc(r.weight)+' lb · '+esc(r.waist)+' in')+'</ul>');}if(page==='body'){h=box('<h2>Weight & waist</h2><form id="form">'+dateInput()+field('weight','Weight (lb)','number','step="0.1" min="1"')+field('waist','Waist (inches)','number','step="0.1" min="1"')+'<button>Save measurements</button></form>')+box('<h2>History</h2><ul>'+rows('body',r=>esc(r.date)+' — '+esc(r.weight)+' lb · '+esc(r.waist)+' in')+'</ul>');}
if(page==='gym'){if(!session){h=libraryHtml()}else{h=box('<h2>'+esc(session.snapshot?.name||routineName(session.day))+'</h2><p>'+esc(session.date)+' · Session in progress</p><div id="sessionProgress"></div><div class="sticky"><span id="restStatus">Rest timer ready</span> <button onclick="startRest(60)">60s</button> <button onclick="startRest(90)">90s</button> <button onclick="startRest(120)">120s</button> <button onclick="stopRest()">Skip</button></div><p><button class="primary" onclick="finishWorkout()">Finish workout</button></p>')+'<input type="hidden" id="day" value="'+esc(session.day)+'"><input type="hidden" id="workoutDate" value="'+esc(session.date)+'"><div id="workout"></div>'}h+=box('<h2>Previous logged sets</h2><ul>'+rows('gym',r=>esc(r.date)+' — '+esc(r.workoutName||routineName(r.day))+': '+esc(r.exercise)+' · '+(r.setNumber?'Set '+esc(r.setNumber)+': ':'')+esc(r.reps)+' reps @ '+esc(r.kg)+' kg')+'</ul>');}
if(page==='activity'){h=box('<h2>Log activity</h2><form id="form">'+dateInput()+field('name','Activity','text','value="Football"')+field('minutes','Duration (minutes)','number','min="1"')+'<button>Save activity</button></form>')+box('<h2>Activity history</h2><ul>'+rows('activity',r=>esc(r.date)+' — '+esc(r.name)+' · '+esc(r.minutes)+' minutes')+'</ul>');}
if(page==='settings'){h=box('<h2>Settings</h2><p>Your data is stored on this device. Back up regularly before clearing browser data or changing phones.</p><button onclick="exportData()">Export JSON backup</button><label>Restore JSON backup <input id="restore" type="file" accept="application/json,.json"></label><p><small>Restoring replaces existing logs and, if included, your workout library.</small></p>');}if(page==='backup'){h=box('<h2>Back up your data</h2><p>Everything is saved in this browser on this device. Clearing site data or changing phones can erase it. Export a backup regularly.</p><button onclick="exportData()">Export JSON backup</button><label>Restore JSON backup <input id="restore" type="file" accept="application/json,.json"></label><p><small>Restoring replaces all existing entries.</small></p>');}
document.getElementById('view').innerHTML=h;let f=document.getElementById('form');if(f)f.onsubmit=e=>{e.preventDefault();if(page==='body'||page==='progress')add('body',{date:val('date'),weight:number('weight'),waist:number('waist')});if(page==='activity')add('activity',{date:val('date'),name:val('name'),minutes:number('minutes')})};if(page==='gym'&&session)renderWorkout();if(page==='backup'||page==='settings')document.getElementById('restore').onchange=restoreData;}
function renderWorkout(){const day=val('day'),date=val('workoutDate');const list=session.snapshot?.exercises||routines[day]||[];const completed=data.gym.filter(r=>r.sessionId===session.id&&r.setNumber).length;const total=list.reduce((sum,x)=>sum+x[1],0);const p=document.getElementById('sessionProgress');if(p)p.innerHTML='<p>'+completed+' of '+total+' sets completed</p><div class="progress"><span style="width:'+Math.min(100,100*completed/total)+'%"></span></div>';document.getElementById('workout').innerHTML=(list.length?'':'<section><p>No exercises in this workout.</p><button onclick="finishWorkout()">Finish</button></section>')+list.map(([name,count,range])=>{const prior=[...data.gym].reverse().find(r=>r.exercise===name&&r.sessionId!==session.id);const done=data.gym.filter(r=>r.sessionId===session.id&&r.exercise===name&&r.setNumber);const previous=prior?'Previous: '+esc(prior.reps)+' reps @ '+esc(prior.kg)+' kg':'No previous sets';return '<section class="exercise-card"><h3>'+esc(name)+'</h3><small>'+count+' sets · target '+range+' · '+previous+'</small>'+Array.from({length:count},(_,i)=>{const existing=done.find(r=>r.setNumber===i+1);const kg=existing?existing.kg:(prior?prior.kg:0);const reps=existing?existing.reps:(prior?prior.reps:0);return '<div class="set-row"><b>Set '+(i+1)+'</b><label>Reps<input style="width:70px" id="reps-'+day+'-'+list.indexOf(list.find(x=>x[0]===name))+'-'+i+'" type="number" min="0" step="1" value="'+reps+'"></label><label>kg<input style="width:80px" id="kg-'+day+'-'+list.indexOf(list.find(x=>x[0]===name))+'-'+i+'" type="number" min="0" step="0.5" value="'+kg+'"></label><button style="background:'+(existing?'#537b56':'#b2f27c')+'" onclick="saveSet(\''+day+'\','+list.findIndex(x=>x[0]===name)+','+i+')">'+(existing?'↻ Update set':'✓ Log set')+'</button></div>'}).join('')+'</section>'}).join('');document.querySelectorAll('.set-row input[type=number]').forEach(input=>{const step=input.id.startsWith('reps-')?1:2.5;const wrap=document.createElement('div');wrap.className='quick-adjust';input.parentNode.insertBefore(wrap,input);const minus=document.createElement('button');minus.type='button';minus.textContent='−';minus.setAttribute('aria-label','Decrease '+(step===1?'reps':'weight'));minus.onclick=()=>adjust(input.id,-step);const plus=document.createElement('button');plus.type='button';plus.textContent='+';plus.setAttribute('aria-label','Increase '+(step===1?'reps':'weight'));plus.onclick=()=>adjust(input.id,step);wrap.append(minus,input,plus)})}
function saveSet(day,exerciseIndex,setIndex){const date=val('workoutDate'),exercise=(session.snapshot?.exercises||routines[day])[exerciseIndex][0],suffix=day+'-'+exerciseIndex+'-'+setIndex;const repsInput=document.getElementById('reps-'+suffix),kgInput=document.getElementById('kg-'+suffix);if(repsInput.value===''||kgInput.value===''||Number(repsInput.value)<0||Number(kgInput.value)<0){alert('Enter reps and weight (use 0 kg for bodyweight exercises).');return}const reps=Number(repsInput.value),kg=Number(kgInput.value);let existing=data.gym.find(r=>r.sessionId===session.id&&r.exercise===exercise&&r.setNumber===setIndex+1);if(existing){existing.reps=reps;existing.kg=kg}else data.gym.push({sessionId:session.id,date,day,programId:session.programId,workoutName:session.snapshot?.name||routineName(day),exercise,setNumber:setIndex+1,sets:1,reps,kg});data.gym.sort((a,b)=>a.date.localeCompare(b.date));save();const drafts={};document.querySelectorAll('#workout input[type=number]').forEach(el=>{drafts[el.id]=el.value});show('gym');for(const [id,value] of Object.entries(drafts)){const el=document.getElementById(id);if(el&&id!==repsInput.id&&id!==kgInput.id)el.value=value}startRest(90);}
function setExercises(){let d=val('day');document.getElementById('exercise-options').innerHTML=(plans[d]||[]).map(x=>'<option value="'+esc(x)+'"></option>').join('');}
function exportData(){let blob=new Blob([JSON.stringify({...data,workoutLibrary:library},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fittrack-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function restoreData(e){try{let d=JSON.parse(await e.target.files[0].text());if(!['body','gym','activity'].every(k=>Array.isArray(d[k])))throw Error('Invalid FitTrack backup');if(confirm('Replace existing data with this backup?')){data={body:d.body,gym:d.gym,activity:d.activity,sessions:Array.isArray(d.sessions)?d.sessions:[]};save();if(d.workoutLibrary&&Array.isArray(d.workoutLibrary.programs)){library=d.workoutLibrary;saveLibrary()}show('dashboard')}}catch(err){alert(err.message)}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});show('dashboard');
</script></body></html>
