function renderWorkout(){const day=val('day'),date=val('workoutDate');const list=session.snapshot?.exercises||routines[day]||[];const completed=data.gym.filter(r=>r.sessionId===session.id&&r.setNumber).length;const total=list.reduce((sum,x)=>sum+x[1],0);const p=document.getElementById('sessionProgress');if(p)p.innerHTML='<p>'+completed+' of '+total+' sets completed</p><div class="progress"><span style="width:'+Math.min(100,100*completed/total)+'%"></span></div>';document.getElementById('workout').innerHTML=(list.length?'':'<section><p>No exercises in this workout.</p><button onclick="finishWorkout()">Finish</button></section>')+list.map(([name,count,range],exerciseIndex)=>{const prior=[...data.gym].reverse().find(r=>r.exercise===name&&r.sessionId!==session.id);const done=data.gym.filter(r=>r.sessionId===session.id&&r.exercise===name&&r.setNumber);const previous=prior?'Previous: '+esc(prior.reps)+' reps @ '+esc(prior.kg)+' kg':'No previous sets';return '<section class="exercise-card"><div class="exercise-head"><div class="exercise-card-heading"><span class="exercise-index">'+String(exerciseIndex+1).padStart(2,'0')+'</span><div><h3>'+esc(name)+'</h3><small>'+count+' sets · target '+range+' · '+previous+'</small></div></div>'+exercisePicture(name,true)+'</div><p><button type="button" onclick="addWorkoutSet('+exerciseIndex+')">+ Add set</button></p>'+Array.from({length:count},(_,i)=>{const existing=done.find(r=>r.setNumber===i+1);const kg=existing?existing.kg:(prior?prior.kg:0);const reps=existing?existing.reps:(prior?prior.reps:0);return '<div class="set-row"><b>Set '+(i+1)+'</b><label>Reps<input style="width:70px" id="reps-'+day+'-'+exerciseIndex+'-'+i+'" type="number" min="0" step="1" value="'+reps+'"></label><label>kg<input style="width:80px" id="kg-'+day+'-'+exerciseIndex+'-'+i+'" type="number" min="0" step="0.5" value="'+kg+'"></label><button style="background:'+(existing?'#537b56':'#b2f27c')+'" onclick="saveSet(\''+day+'\','+exerciseIndex+','+i+')">'+(existing?'↻ function saveSet(day,exerciseIndex,setIndex){const date=val('workoutDate'),exercise=(session.snapshot?.exercises||routines[day])[exerciseIndex][0],suffix=day+'-'+exerciseIndex+'-'+setIndex;const repsInput=document.getElementById('reps-'+suffix),kgInput=document.getElementById('kg-'+suffix);if(repsInput.value===''||kgInput.value===''||Number(repsInput.value)<0||Number(kgInput.value)<0){alert('Enter reps and weight (use 0 kg for bodyweight exercises).');return}const reps=Number(repsInput.value),kg=Number(kgInput.value);let existing=data.gym.find(r=>r.sessionId===session.id&&r.exercise===exercise&&r.setNumber===setIndex+1);if(existing){existing.reps=reps;existing.kg=kg}else data.gym.push({sessionId:session.id,date,day,programId:session.programId,workoutName:session.snapshot?.name||routineName(day),exercise,setNumber:setIndex+1,sets:1,reps,kg});data.gym.sort((a,b)=>a.date.localeCompare(b.date));save();const drafts={};document.querySelectorAll('#workout input[type=number]').forEach(el=>{drafts[el.id]=el.value});show('gym');for(const [id,value] of Object.entries(drafts)){const el=document.getElementById(id);if(el&&id!==repsInput.id&&id!==kgInput.id)el.value=value}startRest();}

/* Nutrition: offline food estimates, editable values, and daily creatine tracking. */
const nutritionKey='fittrack-nutrition-v1';
let nutrition;try{nutrition=JSON.parse(localStorage.getItem(nutritionKey))}catch{}
if(!nutrition||!Array.isArray(nutrition.entries))nutrition={entries:[],proteinGoal:140,calorieGoal:2000,creatine:{}};
if(!nutrition.creatine)nutrition.creatine={};
if(!Array.isArray(nutrition.savedFoods))nutrition.savedFoods=[];
const saveNutrition=()=>localStorage.setItem(nutritionKey,JSON.stringify(nutrition));
let nutritionDate=today();
const foodCatalog=[
{re:/\b(?:boiled |scrambled |fried )?eggs?\b/i,unit:'each',cal:78,protein:6.3,defaultQty:1},
{re:/\bchicken breast\b/i,unit:'g',cal:1.65,protein:.31,defaultQty:100},
{re:/\brice\b/i,unit:'g',cal:1.3,protein:.027,defaultQty:100},
{re:/\bprotein shake\b|\bprotein powder\b/i,unit:'serving',cal:120,protein:24,defaultQty:1},
{re:/\b(?:semi[- ]skimmed )?milk\b/i,unit:'ml',cal:.47,protein:.036,defaultQty:250},
{re:/\bbanana\b/i,unit:'each',cal:105,protein:1.3,defaultQty:1},
{re:/\b(?:wholemeal )?bread\b|\btoast\b/i,unit:'slice',cal:90,protein:3.5,defaultQty:1},
{re:/\b(?:boiled |cooked |sliced )?ham\b/i,unit:'slice',cal:24,protein:4,defaultQty:1},
{re:/\bcreatine\b/i,unit:'supplement',cal:0,protein:0,defaultQty:5}
];

function foodParts(name){
 const t=String(name||'').toLowerCase().trim().replace(/\s+/g,' ');
 const m=t.match(/^(\d+(?:\.\d+)?)\s*(slices?|eggs?|pieces?|servings?|g|grams?|kg|ml|l)?\s*(?:of\s+)?(.+)$/i);
 if(!m)return {key:t,qty:1,unit:'item'};
 let qty=Number(m[1]),unit=(m[2]||'item').toLowerCase(),base=m[3].trim();
 if(unit==='kg'){qty*=1000;unit='g'}if(unit==='l'){qty*=1000;unit='ml'}
 if(unit.startsWith('slice'))unit='slice';else if(unit.startsWith('egg')){unit='item';base='egg '+base}else if(unit.startsWith('piece'))unit='piece';else if(unit.startsWith('serving'))unit='serving';else if(unit.startsWith('gram'))unit='g';
 return {key:base,qty,unit};
}
function rememberedFood(name){
 const p=foodParts(name),exact=nutrition.savedFoods.find(f=>f.name.toLowerCase().trim()===name.toLowerCase().trim());
 if(exact)return {name,calories:exact.calories,protein:exact.protein,remembered:true};
 const f=nutrition.savedFoods.find(f=>f.key===p.key&&f.unit===p.unit&&f.qty>0);
 if(!f)return null;
 return {name,calories:Math.round(f.calories*p.qty/f.qty),protein:Math.round(f.protein*p.qty/f.qty*10)/10,remembered:true};
}
function rememberFood(name,calories,protein){
 const p=foodParts(name),record={name,key:p.key,unit:p.unit,qty:p.qty,calories,protein};
 const idx=nutrition.savedFoods.findIndex(f=>f.key===p.key&&f.unit===p.unit);
 if(idx>=0)nutrition.savedFoods[idx]=record;else nutrition.savedFoods.push(record);
}
function deleteSavedFood(index){if(!confirm('Forget this saved food? Diary entries will stay.'))return;nutrition.savedFoods.splice(index,1);saveNutrition();show('nutrition');}
function editSavedFood(index){
 const f=nutrition.savedFoods[index];if(!f)return;
 const c=prompt('Calories for '+f.name,f.calories);if(c===null)return;
 const p=prompt('Protein (g) for '+f.name,f.protein);if(p===null)return;
 if(c.trim()===''||p.trim()===''||![Number(c),Number(p)].every(Number.isFinite)||Number(c)<0||Number(p)<0){alert('Enter valid calories and protein.');return}
 f.calories=Number(c);f.protein=Number(p);saveNutrition();show('nutrition');
}

function foodEstimate(raw){
 const remembered=rememberedFood(raw);if(remembered)return remembered;
 const t=raw.trim(),f=foodCatalog.find(x=>x.re.test(t));
 if(!f)return null;
 const m=t.match(/(\d+(?:\.\d+)?)\s*(kg|g|grams?|ml|litres?|l)\b/i);
 const leading=t.match(/^(\d+(?:\.\d+)?)/);
 let qty=m?Number(m[1]):leading?Number(leading[1]):f.defaultQty;
 if(m&&m[2].toLowerCase()==='kg')qty*=1000;
 if(m&&['l','litre','litres'].includes(m[2].toLowerCase()))qty*=1000;
 if(!Number.isFinite(qty)||qty<=0)return null;
 if(m&&f.unit==='slice'){return {name:t,calories:Math.round(qty*1.2),protein:Math.round(qty*.2*10)/10}};
 if(f.unit==='supplement')return {name:t,calories:0,protein:0,creatine:qty};
 return {name:t,calories:Math.round(qty*f.cal),protein:Math.round(qty*f.protein*10)/10};
}
function nutritionView(){
 const day=nutrition.entries.filter(x=>x.date===nutritionDate);
 const kcal=Math.round(day.reduce((n,x)=>n+Number(x.calories||0),0));
 const protein=Math.round(day.reduce((n,x)=>n+Number(x.protein||0),0)*10)/10;
 const progress=(n,g)=>'<div class="progress"><span style="width:'+Math.min(100,Math.max(0,n/g*100))+'%"></span></div>';
 return '<section><h2>Nutrition tracker</h2><p class="muted">Log food in plain English. Estimates are approximate and can be edited before saving.</p><label>Day <input type="date" id="nutritionDate" value="'+esc(nutritionDate)+'" onchange="nutritionDate=this.value;show(\'nutrition\')"></label><div class="stat-grid"><div class="stat-card"><div class="stat-value">'+kcal+'</div><div class="stat-label">Calories / '+nutrition.calorieGoal+'</div>'+progress(kcal,nutrition.calorieGoal)+'</div><div class="stat-card"><div class="stat-value">'+protein+'g</div><div class="stat-label">Protein / '+nutrition.proteinGoal+'g</div>'+progress(protein,nutrition.proteinGoal)+'</div><div class="stat-card"><div class="stat-value">'+(nutrition.creatine[nutritionDate]?'✓':'—')+'</div><div class="stat-label">Creatine today</div></div></div></section>'+
 '<section><h2>Quick food entry</h2><label>What have you eaten? <input id="foodText" style="width:100%;max-width:100%" placeholder="e.g. 3 boiled eggs" onkeydown="if(event.key===\'Enter\'){event.preventDefault();estimateFood()}"></label><button class="primary" onclick="estimateFood()">Estimate nutrition</button><div id="foodPreview" aria-live="polite"></div><p><small>Try: 3 boiled eggs, 300g chicken breast, 250ml milk, protein shake. For mixed meals, log ingredients separately. Unknown foods can be entered manually.</small></p><button onclick="manualFood()">Enter calories & protein manually</button></section>'+
 '<section><h2>Creatine</h2><label><input type="checkbox" '+(nutrition.creatine[nutritionDate]?'checked':'')+' onchange="nutrition.creatine[nutritionDate]=this.checked;saveNutrition();show(\'nutrition\')"> Taken today</label><small>Plain creatine adds no meaningful calories or protein.</small></section>'+
 '<section><h2>Food diary</h2>'+(day.length?day.map(x=>'<div class="history-session"><strong>'+esc(x.name)+'</strong><div class="muted">'+Number(x.calories)+' kcal · '+Number(x.protein)+'g protein</div><button class="danger" onclick="deleteFood(\''+esc(x.id)+'\')">Delete</button></div>').join(''):'<p class="muted">Nothing logged for this day yet.</p>')+'</section>'+
 '<section><h2>Saved foods</h2><p class="muted">Foods you log are remembered for next time. Edit or forget them here.</p>'+(nutrition.savedFoods.length?nutrition.savedFoods.map((f,i)=>'<div class="history-session"><strong>'+esc(f.name)+'</strong><div class="muted">'+f.calories+' kcal · '+f.protein+'g protein</div><button onclick="editSavedFood('+i+')">Edit</button> <button class="danger" onclick="deleteSavedFood('+i+')">Forget</button></div>').join(''):'<p class="muted">No saved foods yet.</p>')+'</section>'+ '<section><h2>Daily targets</h2><label>Calories <input id="calGoal" type="number" min="1" value="'+nutrition.calorieGoal+'"></label><label>Protein (g) <input id="proGoal" type="number" min="1" value="'+nutrition.proteinGoal+'"></label><button onclick="setNutritionGoals()">Save targets</button><p><small>These are editable starting targets, not personalised recommendations.</small></p></section>';
}
function estimateFood(){const t=document.getElementById('foodText').value;const e=foodEstimate(t);if(e?.creatine){nutrition.creatine[nutritionDate]=true;saveNutrition();show('nutrition');return}manualFood(e||{name:t,calories:0,protein:0,unknown:true});}
function manualFood(e={name:'',calories:0,protein:0}){document.getElementById('foodPreview').innerHTML='<div class="history-session">'+(e.unknown?'<p role="status" style="color:#ffcc80"><strong>Food not recognised.</strong> Enter the calories and protein from the packaging before saving. Zero is not an estimate.</p>' :'<p class="muted">'+(e.remembered?'Using your saved food values.':'Approximate estimate — check portion size and packaging.')+'</p>')+'<label>Food <input id="foodName" value="'+esc(e.name)+'"></label><label>Estimated calories <input id="foodCalories" type="number" min="0" value="'+e.calories+'"></label><label>Protein (g) <input id="foodProtein" type="number" min="0" step="0.1" value="'+e.protein+'"></label><button onclick="saveFood()">Add to diary</button></div>';}
function saveFood(){const name=document.getElementById('foodName').value.trim(),calories=Number(document.getElementById('foodCalories').value),protein=Number(document.getElementById('foodProtein').value);if(!name||![calories,protein].every(Number.isFinite)||calories<0||protein<0){alert('Enter a food name and valid values.');return}nutrition.entries.push({id:String(Date.now())+'-'+Math.random().toString(36).slice(2),date:nutritionDate,name,calories,protein});rememberFood(name,calories,protein);saveNutrition();show('nutrition');}
function deleteFood(id){if(!confirm('Delete this food entry?'))return;nutrition.entries=nutrition.entries.filter(x=>x.id!==id);saveNutrition();show('nutrition');}
function setNutritionGoals(){const c=Number(document.getElementById('calGoal').value),p=Number(document.getElementById('proGoal').value);if(c<=0||p<=0||!Number.isFinite(c)||!Number.isFinite(p)){alert('Enter positive targets.');return}nutrition.calorieGoal=c;nutrition.proteinGoal=p;saveNutrition();show('nutrition');}


/* FitTrack enhanced logging and completion summary */
const ftOldRenderWorkout=renderWorkout;
renderWorkout=function(){
 ftOldRenderWorkout();
 const list=session?.snapshot?.exercises||[];
 document.querySelectorAll('#workout .exercise-card').forEach((card,ei)=>{
  const name=list[ei]?.[0]||'';
  const rows=card.querySelectorAll('.set-row');
  rows.forEach((row,si)=>{
   const record=data.gym.find(r=>r.sessionId===session.id&&r.exercise===name&&r.setNumber===si+1);
   const extras=document.createElement('div');extras.className='ft-set-extras';
   extras.innerHTML='<label>Type <select class="ft-type"><option value="working">Working</option><option value="warmup">Warm-up</option><option value="dropset">Drop set</option></select></label><label>Notes <input class="ft-note" type="text" maxlength="160" placeholder="Optional set note"></label>';
   row.appendChild(extras);
   extras.querySelector('.ft-type').value=record?.setType||'working';
   extras.querySelector('.ft-note').value=record?.note||'';
  });
  const perHand=document.createElement('label');perHand.className='ft-per-hand';
  const isDumbbell=/dumbbell/i.test(name);
  perHand.innerHTML='<input type="checkbox" '+(isDumbbell?'checked':'')+'> Weight entered per hand (two dumbbells)';
  const setting=data.exerciseModes?.[name];
  perHand.querySelector('input').checked=setting===undefined?isDumbbell:setting;
  perHand.querySelector('input').onchange=e=>{data.exerciseModes??={};data.exerciseModes[name]=e.target.checked;save()};
  card.querySelector('.exercise-head')?.after(perHand);
 });
};
const ftOldSaveSet=saveSet;
saveSet=function(day,ei,si){
 const card=document.querySelectorAll('#workout .exercise-card')[ei];
 const row=card?.querySelectorAll('.set-row')[si];
 const type=row?.querySelector('.ft-type')?.value||'working';
 const note=row?.querySelector('.ft-note')?.value||'';
 const name=session?.snapshot?.exercises?.[ei]?.[0];
 const valid=!!document.getElementById('reps-'+day+'-'+ei+'-'+si)?.value && document.getElementById('kg-'+day+'-'+ei+'-'+si)?.value!=='';
 ftOldSaveSet(day,ei,si);
 if(valid&&session&&name){
  const r=data.gym.find(x=>x.sessionId===session.id&&x.exercise===name&&x.setNumber===si+1);
  if(r){r.setType=type;r.note=note;r.perHand=!!data.exerciseModes?.[name] || (data.exerciseModes?.[name]===undefined&&/dumbbell/i.test(name));save();renderWorkout()}
 }
};
function ftVolume(r){return (Number(r.kg)||0)*(Number(r.reps)||0)*(r.perHand?2:1)}
function ftSummary(record){
 const sets=record.sets||[];
 const working=sets.filter(r=>r.setType!=='warmup');
 const reps=working.reduce((n,r)=>n+(Number(r.reps)||0),0);
 const volume=working.reduce((n,r)=>n+ftVolume(r),0);
 const duration=Math.max(0,Math.round(((record.finishedAt||0)-(record.startedAt||0))/60000));
 const names=[...new Set(working.map(r=>r.exercise))];
 const detail=names.map(name=>{
  const entries=working.filter(r=>r.exercise===name);
  const best=entries.reduce((a,b)=>!a||ftVolume(b)>ftVolume(a)?b:a,null);
  return '<div class="ft-summary-row"><span>'+esc(name)+' <small>('+entries.length+' sets)</small></span><strong>'+esc(best?.kg||0)+' kg × '+esc(best?.reps||0)+(best?.perHand?' each':'')+'</strong></div>';
 }).join('');
 return '<section class="ft-summary"><div class="ft-celebrate">✓</div><h2>Nice work!</h2><p>'+esc(record.name)+' · '+esc(record.date)+'</p><div class="ft-summary-stats"><div><strong>'+duration+'</strong><small>Minutes</small></div><div><strong>'+working.length+'</strong><small>Sets</small></div><div><strong>'+reps+'</strong><small>Reps</small></div></div><h3>'+volume.toLocaleString('en-GB')+' kg lifted</h3>'+detail+'<button class="primary" onclick="ftShareSummary()">Share summary</button><button onclick="show(\'progress\')">View progress</button><button onclick="show(\'dashboard\')">Done</button></section>';
}
let ftLastSummary=null;
function ftShareSummary(){
 if(!ftLastSummary)return;
 const r=ftLastSummary,sets=(r.sets||[]).filter(x=>x.setType!=='warmup');
 const message='FitTrack 💪 '+r.name+' ('+r.date+')\\n'+sets.length+' sets · '+sets.reduce((n,x)=>n+(Number(x.reps)||0),0)+' reps · '+sets.reduce((n,x)=>n+ftVolume(x),0).toLocaleString('en-GB')+' kg lifted';
 if(navigator.share)navigator.share({title:'FitTrack workout',text:message}).catch(()=>{});
 else if(navigator.clipboard)navigator.clipboard.writeText(message).then(()=>alert('Summary copied'));
 else prompt('Copy your workout summary',message);
}
const ftOldFinishWorkout=finishWorkout;
finishWorkout=function(){
 const before=data.sessions.length;
 ftOldFinishWorkout();
 if(data.sessions.length>before){ftLastSummary=data.sessions[data.sessions.length-1];document.getElementById('view').innerHTML=ftSummary(ftLastSummary)}
};
const ftOldShow=show;
show=function(page){ftOldShow(page);if(page==='progress'){
 const sessions=data.sessions||[];
 const sets=sessions.flatMap(s=>s.sets||[]).filter(r=>r.setType!=='warmup');
 const exercises=[...new Set(sets.map(r=>r.exercise))].sort();
 const area=document.getElementById('view');
 const section=document.createElement('section');
 section.innerHTML='<h2>Exercise statistics</h2><p class="muted">Your logged working sets, excluding warm-ups.</p><label>Exercise <select id="ft-stat-exercise">'+exercises.map(x=>'<option>'+esc(x)+'</option>').join('')+'</select></label><div id="ft-stat-results"></div>';
 area.prepend(section);
 const draw=()=>{const name=document.getElementById('ft-stat-exercise')?.value;const matches=sets.filter(r=>r.exercise===name);const best=matches.reduce((a,b)=>!a||ftVolume(b)>ftVolume(a)?b:a,null);document.getElementById('ft-stat-results').innerHTML=matches.length?'<p><strong>'+matches.length+'</strong> logged sets · Best volume set: <strong>'+esc(best.kg)+' kg × '+esc(best.reps)+(best.perHand?' per hand':'')+'</strong></p>':'<p>No exercise records yet.</p>'};
 document.getElementById('ft-stat-exercise').onchange=draw;draw();
}};

if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});show('dashboard');
</script></body></html>
